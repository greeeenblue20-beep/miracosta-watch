name: hotel-watch

on:
  schedule:
    - cron: "*/5 * * * *" # 5分ごと(GitHub側の混雑で数分遅れることあり)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 空室チェック
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_REFERER: ${{ secrets.RAKUTEN_REFERER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node check.js
      - name: 状態を保存(変化があった時だけ)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add state.json
          # checkedAt だけの変化ではコミットしない。ただし最終コミットから30日以上空いたら、
          # GitHub が60日無更新で定期実行を止めるのを防ぐためコミットする
          stale=$(( $(date +%s) - $(git log -1 --format=%ct) > 30*24*3600 ))
          if git diff --cached -U0 state.json | grep -E '^[+-] ' | grep -vq checkedAt || [ "$stale" = 1 ]; then
            git commit -m "update state" && git push
          fi
